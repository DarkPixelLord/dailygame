<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<title>Laurus portrait card</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Geist:wght@500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body {
    font-family: "Geist", sans-serif; color: #e2e8f0; position: relative;
    background: radial-gradient(ellipse at 60% 55%, #18213f 0%, #0d1328 55%, #070b18 100%);
  }
  #world { position: absolute; inset: 0; }

  .head { position: absolute; left: 90px; top: 84px; right: 90px; }
  .brand { display: flex; align-items: center; gap: 22px; }
  .brand svg { width: 104px; height: 104px; fill: #fbbf24; }
  .brand span { font-family: "Cinzel", serif; font-weight: 900; font-size: 96px; color: #fbbf24; letter-spacing: 10px; }
  .tagline { margin-top: 30px; font-family: "Cinzel", serif; font-weight: 900; font-size: 50px; line-height: 1.2; color: #f8fafc; letter-spacing: 1px; }
  .tagline em { font-style: normal; color: #fbbf24; }

  /* ---- vertical journey, same reading as the app: oldest at the bottom ---- */
  .line, .fill { position: absolute; left: 200px; width: 4px; margin-left: -2px; border-radius: 2px; }
  .line { background: rgba(100,116,139,.35); }
  .fill { background: #c8962a; }
  .node { position: absolute; left: 200px; width: 76px; height: 76px; margin: -38px 0 0 -38px; border-radius: 50%;
    background: #0d1328; border: 3.5px solid rgba(200,150,42,.75); display: grid; place-items: center; }
  .node svg { width: 42px; height: 42px; fill: #fcd34d; }
  .node.future { border-color: rgba(100,116,139,.45); }
  .node.current { border-color: #fbbf24; box-shadow: 0 0 0 7px rgba(251,191,36,.15), 0 0 34px rgba(251,191,36,.4); }
  .lbl { position: absolute; left: 272px; transform: translateY(-50%); }
  .lbl b { display: block; font-size: 34px; font-weight: 900; color: #fff; }
  .lbl i { display: block; font-style: normal; font-size: 26px; font-weight: 500; color: #94a3b8; margin-top: 2px; }
  .lbl.current b { color: #fbbf24; }
  .lbl.future b { color: #64748b; }
  .lbl.future i { color: #475569; }
  .pawn { position: absolute; left: 62px; width: 60px; height: 60px; fill: #fbbf24; margin-top: -48px; filter: drop-shadow(0 0 10px rgba(251,191,36,.45)); }
  .pawn-dots { position: absolute; left: 116px; width: 40px; border-top: 4px dotted #fbbf24; }

  .foot { position: absolute; left: 90px; right: 90px; bottom: 78px; display: flex; justify-content: space-between; align-items: baseline; }
  .foot b { font-size: 36px; font-weight: 900; color: #fbbf24; }
  .foot span { font-size: 24px; font-weight: 700; color: #94a3b8; letter-spacing: 2px; text-transform: uppercase; }
</style>
</head>
<body>
  <svg id="world" width="1080" height="1350"></svg>

  <div class="head">
    <div class="brand"><svg viewBox="0 0 512 512"><path d="LAUREL"/></svg><span>LAURUS</span></div>
    <div class="tagline">{{TAGLINE}}</div>
  </div>

  <!-- TIMELINE -->

  <div class="foot"><b>laurus.vercel.app</b><span>{{META}}</span></div>

<script>
  // Faint world map backdrop (Natural Earth 110m), with a few event pins.
  const world = /*WORLD*/null;
  const svg = d3.select("#world");
  const proj = d3.geoEqualEarth().rotate([-10, 0]).scale(330).translate([640, 760]);
  const path = d3.geoPath(proj);
  svg.append("path").datum(d3.geoGraticule10()).attr("d", path)
    .attr("fill", "none").attr("stroke", "rgba(148,163,184,.06)").attr("stroke-width", 1);
  // Antarctica (id 010) dropped: it only shows up as a stray line above the footer.
  const land = topojson.merge(world, world.objects.countries.geometries.filter((g) => g.id !== "010"));
  svg.append("path").datum(land).attr("d", path)
    .attr("fill", "rgba(148,163,184,.075)").attr("stroke", "rgba(203,213,225,.16)").attr("stroke-width", 1);
  // Bahamas, Rome, Giza, Byblos, Beijing, Cuzco
  for (const c of [[-74.5, 24.1], [12.5, 41.9], [31.1, 29.98], [35.65, 34.12], [116.4, 39.9], [-71.97, -13.53]]) {
    const [x, y] = proj(c);
    svg.append("circle").attr("cx", x).attr("cy", y).attr("r", 16).attr("fill", "rgba(251,191,36,.10)");
    svg.append("circle").attr("cx", x).attr("cy", y).attr("r", 6).attr("fill", "rgba(251,191,36,.55)");
  }
</script>
</body>
</html>
