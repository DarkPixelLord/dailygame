<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1600px; height: 900px; overflow: hidden; }
  body {
    font-family: "Geist", sans-serif;
    color: #fff;
    background:
      radial-gradient(ellipse at 78% 50%, rgba(59,130,246,.22) 0%, transparent 55%),
      radial-gradient(ellipse at 10% 0%, rgba(251,191,36,.10) 0%, transparent 45%),
      linear-gradient(135deg, #0a0f1f 0%, #131a33 55%, #0a0f1f 100%);
    position: relative;
  }
  /* faint dotted grid, evokes a map without competing with the screenshots */
  body::before {
    content: ""; position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,.07) 1.5px, transparent 1.5px);
    background-size: 28px 28px;
  }
  .left {
    position: absolute; left: 90px; top: 0; bottom: 0; width: 720px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .brand { display: flex; align-items: center; gap: 18px; margin-bottom: 44px; }
  .brand svg { width: 64px; height: 64px; }
  .brand span { font-family: "Cinzel", serif; font-weight: 900; font-size: 52px; color: #fbbf24; letter-spacing: 1px; }
  .brand em { font-style: normal; font-size: 20px; font-weight: 700; color: #94a3b8; letter-spacing: 3px; text-transform: uppercase; margin-left: 6px; margin-top: 10px; }
  h1 { font-size: 76px; line-height: 1.02; font-weight: 900; letter-spacing: -2.5px; text-transform: uppercase; }
  h1 .gold { color: #fbbf24; }
  .steps { margin-top: 40px; display: flex; flex-direction: column; gap: 16px; }
  .step { display: flex; align-items: center; gap: 18px; font-size: 28px; font-weight: 500; color: #cbd5e1; }
  .step b { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 3px solid #fbbf24; color: #fbbf24; display: grid; place-items: center; font-size: 22px; font-weight: 900; }
  .cta {
    margin-top: 48px; align-self: flex-start;
    background: #fbbf24; color: #0a0f1f; border-radius: 18px;
    box-shadow: 0 8px 0 #b45309, 0 18px 40px rgba(251,191,36,.25);
    padding: 22px 40px; font-size: 32px; font-weight: 900; text-transform: uppercase; letter-spacing: .5px;
  }
  .meta { margin-top: 30px; font-size: 22px; font-weight: 700; color: #64748b; letter-spacing: 2px; text-transform: uppercase; }

  .phones { position: absolute; right: 40px; top: 0; bottom: 0; width: 760px; }
  .phone {
    position: absolute; width: 300px; border-radius: 34px; overflow: hidden;
    border: 6px solid #1e293b; box-shadow: 0 30px 60px rgba(0,0,0,.6);
  }
  .phone img { display: block; width: 100%; }
  .p1 { left: 40px;  top: 130px; transform: rotate(-7deg); }
  .p3 { left: 440px; top: 130px; transform: rotate(7deg); }
  .p2 { left: 230px; top: 85px;  width: 320px; z-index: 2; }
</style>
